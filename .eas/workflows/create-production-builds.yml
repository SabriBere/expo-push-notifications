name: Android CI

on:
  push:
    branches:
      - main

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  validate:
    name: Validate project
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run lint
        run: npm run lint
      - name: Run TypeScript check
        run: npm run typecheck
      - name: Run Android prebuild
        run: npm run prebuild:android

  build_android:
    name: Build Android APK from main
    needs: [validate]
    type: build
    params:
      platform: android
      profile: preview
