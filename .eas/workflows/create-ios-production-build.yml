name: iOS Production CI

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  validate:
    name: Validate project
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run lint
        run: npm run lint
      - name: Run TypeScript check
        run: npm run typecheck

