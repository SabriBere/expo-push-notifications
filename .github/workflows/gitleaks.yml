name: Secret detection

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch every remote branch and tag
        run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.11

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan all Git history
        run: $(go env GOPATH)/bin/gitleaks git . --log-opts="--all" --redact=100 --no-banner
