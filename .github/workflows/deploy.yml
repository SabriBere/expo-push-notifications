name: Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-modeling:
    name: Validate branch model
    runs-on: ubuntu-latest
    steps:
      - name: Allow only develop into main
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'develop' }}
        run: |
          echo "Solo se permite mergear develop hacia main."
          echo "Branch origen: ${{ github.head_ref }}"
          echo "Branch destino: ${{ github.base_ref }}"
          exit 1

      - name: Confirm branch model
        run: echo "Branch model OK."

  validate:
    name: Validate project
    needs: branch-modeling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  deploy:
    name: Deploy Android build
    needs: validate
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Android preview build
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait

  notify:
    name: Send deploy email
    needs: deploy
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        if: ${{ needs.deploy.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ secrets.SMTP_TO }}
          subject: Deploy exitoso - TestNotifications
          body: |
            El deploy de TestNotifications finalizo correctamente.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: ${{ needs.deploy.result != 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ secrets.SMTP_TO }}
          subject: Deploy fallido - TestNotifications
          body: |
            El deploy de TestNotifications fallo.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
