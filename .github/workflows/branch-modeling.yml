name: Branch Modeling

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
      - develop
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-main-source:
    name: Validate main source branch
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Allow only develop into main
        if: ${{ github.head_ref != 'develop' }}
        run: |
          echo "Solo se permite mergear develop hacia main."
          echo "Branch origen: ${{ github.head_ref }}"
          echo "Branch destino: ${{ github.base_ref }}"
          exit 1

      - name: Confirm develop to main
        if: ${{ github.head_ref == 'develop' }}
        run: |
          echo "Branch model OK: develop -> main."

  delete-merged-branch:
    name: Delete merged branch
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref != 'main' &&
        github.event.pull_request.head.ref != 'develop'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete source branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });

            core.info(`Deleted merged branch: ${branch}`);

  protect-long-lived-branches:
    name: Protect main and develop from deletion
    if: ${{ github.event_name == 'delete' && github.event.ref_type == 'branch' && (github.event.ref == 'main' || github.event.ref == 'develop') }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail protected branch deletion
        run: |
          echo "No se debe borrar la branch protegida: ${{ github.event.ref }}"
          echo "Configura branch protection/rulesets para bloquear el borrado antes de que ocurra."
          exit 1
